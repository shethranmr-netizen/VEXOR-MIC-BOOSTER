
name: Build VEXOR MIC BOOSTER APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Android SDK found"

      - name: Extract project
        run: |
          mkdir source
          unzip -q VEXOR-MIC-BOOSTER-Vercel-Ready.zip -d source

      - name: Build APK
        run: gradle -p source --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXOR-MIC-BOOSTER-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
